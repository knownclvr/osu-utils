<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }

    #hud {
      box-sizing: border-box;
      padding: 9px 14px;
      color: #fff;
      font: 700 20px/1.4 'Malgun Gothic', sans-serif;
      text-shadow: 0 1px 3px #000;
      display: none;
      border-left: 4px solid #fff;
      border-radius: 5px;
      background: transparent;
    }

    #brand { font-size: 16px; color: #fff; }
    #map { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tiers { white-space: nowrap; font-size: 18px; }
    #whole { color: #fff; }
    #segment { color: #4de6ff; }

    #bottom {
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      align-items: center;
      color: #b9b0c9;
    }

    #state { color: #ffcf68; }
    #state.running { color: #75ff9c; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="brand">오수핵</div>
    <div id="map"></div>
    <div id="tiers">원래단: <span id="whole"></span> | 구간단: <span id="segment"></span></div>
    <div id="bottom"><span id="state"></span></div>
  </div>
  <script src="hud.js?v=7"></script>
</body>
</html>
